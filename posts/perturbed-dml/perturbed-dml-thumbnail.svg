<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <rect width="800" height="450" fill="#FA8072"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#1a1a1a">Perturbed Double Machine Learning</text>
  <text x="400" y="62" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#0d7c5f" font-weight="600">Valid inference when nuisance estimators converge too slowly</text>

  <!-- Three-step pipeline -->
  <!-- Step 1: Perturb -->
  <rect x="40" y="90" width="210" height="100" rx="10" fill="#ffffff" stroke="#0d7c5f" stroke-width="1.5"/>
  <text x="145" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0d7c5f">1. PERTURB</text>
  <text x="145" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">Inject noise M times</text>
  <text x="145" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">into nuisance estimation</text>
  <text x="145" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#0d7c5f">M = 500</text>

  <!-- Arrow 1 -->
  <line x1="255" y1="140" x2="290" y2="140" stroke="#0d7c5f" stroke-width="2" marker-end="url(#arrowhead)"/>

  <!-- Step 2: Filter -->
  <rect x="295" y="90" width="210" height="100" rx="10" fill="#ffffff" stroke="#6d5acd" stroke-width="1.5"/>
  <text x="400" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#6d5acd">2. FILTER</text>
  <text x="400" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">Keep perturbations close</text>
  <text x="400" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">to original DML estimate</text>
  <text x="400" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#6d5acd">top 5%</text>

  <!-- Arrow 2 -->
  <line x1="510" y1="140" x2="545" y2="140" stroke="#6d5acd" stroke-width="2" marker-end="url(#arrowhead2)"/>

  <!-- Step 3: Union -->
  <rect x="550" y="90" width="210" height="100" rx="10" fill="#ffffff" stroke="#d4563a" stroke-width="1.5"/>
  <text x="655" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#d4563a">3. UNION</text>
  <text x="655" y="135" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">Merge retained CIs</text>
  <text x="655" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">into final interval</text>
  <text x="655" y="175" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" fill="#d4563a">CI*</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0d7c5f"/>
    </marker>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d5acd"/>
    </marker>
  </defs>

  <!-- Results comparison box -->
  <rect x="40" y="215" width="720" height="130" rx="10" fill="#ffffff" stroke="#e5e5e5" stroke-width="1"/>
  <text x="400" y="240" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Coverage at 95% Nominal (s = 100 sparse covariates)</text>

  <!-- Standard DML bar -->
  <rect x="80" y="260" width="257" height="28" rx="5" fill="#d4563a" opacity="0.8"/>
  <text x="90" y="279" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Standard DML Wald</text>
  <text x="327" y="279" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">71.4%</text>

  <!-- Perturbed DML bar -->
  <rect x="80" y="296" width="347" height="28" rx="5" fill="#0d7c5f" opacity="0.9"/>
  <text x="90" y="315" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#ffffff">Perturbed DML</text>
  <text x="417" y="315" text-anchor="end" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">96.4%</text>

  <!-- 95% target line -->
  <line x1="423" y1="255" x2="423" y2="330" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="428" y="268" font-family="system-ui, sans-serif" font-size="9" fill="#1a1a1a">95% target</text>

  <!-- Key stats -->
  <text x="550" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a4a">CI length overhead:</text>
  <text x="680" y="275" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0d7c5f">only ~17%</text>
  <text x="550" y="300" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a4a">Minimax optimal:</text>
  <text x="680" y="300" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#0d7c5f">Yes</text>
  <text x="550" y="325" font-family="system-ui, sans-serif" font-size="11" fill="#4a4a4a">Works with:</text>
  <text x="680" y="325" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6d5acd">Lasso, GAM, XGB</text>

  <!-- Key insight box -->
  <rect x="40" y="360" width="720" height="55" rx="10" fill="#ffffff" stroke="#0d7c5f" stroke-width="1.5"/>
  <text x="55" y="382" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#0d7c5f">Key Insight</text>
  <text x="55" y="402" font-family="system-ui, sans-serif" font-size="10" fill="#4a4a4a">Among M random perturbations, at least one noise draw approximately cancels the true nuisance error</text>
  <text x="55" y="412" font-family="system-ui, sans-serif" font-size="9" fill="#8a8a8a">→ that perturbation's CI has valid coverage → the union includes it → honest inference without rate assumptions</text>

  <!-- Footer -->
  <text x="400" y="440" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8a8a8a">Zheng, Bonvini, Guo (Feb 2026) · arXiv:2511.01222v2</text>
</svg>
